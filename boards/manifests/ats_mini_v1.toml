schema = 1

[board]
id = "ats_mini_v1"
name = "ATS-Mini v1"
vendor = "esp32-si4732"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
  "display_st7789_i80",
]
capabilities = [
  "psram", "simd", "display", "gfx", "cdc", "uart", "i2c", "spi",
  "wifi", "ble", "gpio", "adc", "pwm",
  "expansion_i2c", "expansion_spi", "expansion_uart", "pm_uart",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7789"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "170"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "170"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_PCLK_HZ = "20000000"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_DISPLAY_GAP_X = "35"
SOLAR_OS_BOARD_DISPLAY_GAP_Y = "0"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_5"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_6"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_7"
SOLAR_OS_BOARD_PIN_LCD_WR = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_LCD_RD = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_38"
SOLAR_OS_BOARD_LCD_DATA_PINS = """{ \\
    GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42, \\
    GPIO_NUM_45, GPIO_NUM_46, GPIO_NUM_47, GPIO_NUM_48, \\
}"""
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_UART_NO_FALLBACK_SHELL = "1"
SOLAR_OS_BOARD_PIN_PM_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_PM_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_18"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_17"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_11"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_PIN_BATTERY_ADC = "GPIO_NUM_4"
SOLAR_OS_BOARD_PIN_RADIO_RESET = "GPIO_NUM_16"
SOLAR_OS_BOARD_PIN_RADIO_LDO_ENABLE = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_AUDIO_MUTE = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_AUDIO_AMP_ENABLE = "GPIO_NUM_10"

[runtime]
spi_hosts = ["SPI2_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 18
scl = 17
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 12
miso = 13
mosi = 11
cs = [14]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

