schema = 1

[board]
id = "m5stack_cores3"
name = "M5Stack CoreS3"
vendor = "M5Stack"
module = "ESP32-S3"

[target]
mcu = "esp32s3"
platformio_board = "m5stack-cores3"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "pwm_esp_idf",
  "pmic_axp2101",
  "io_expander_aw9523b",
  "display_ili9342c_cores3",
]
capabilities = [
  "psram", "simd", "display", "gfx", "cdc", "uart", "i2c", "spi",
  "wifi", "ble", "gpio", "pwm", "pm_uart",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ILI9342C"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "240"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "240"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "40000000"
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0xa8"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_DISPLAY_INVERT = "1"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_35"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_3"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"LCD_SPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_36"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_37"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_NC"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_11"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_PM_UART_PORT = "UART_NUM_1"
SOLAR_OS_BOARD_PIN_PM_UART_TX = "GPIO_NUM_17"
SOLAR_OS_BOARD_PIN_PM_UART_RX = "GPIO_NUM_18"
SOLAR_OS_BOARD_ALWAYS_PORT_SHELL = "1"

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 12
scl = 11
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 36
mosi = 37
cs = [3]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[pins]]
gpio = 1
policy = "fixed"
role = "Grove Port A I2C SCL"
[[pins]]
gpio = 2
policy = "fixed"
role = "Grove Port A I2C SDA"
[[pins]]
gpio = 3
policy = "fixed"
role = "LCD CS"
[[pins]]
gpio = 11
policy = "fixed"
role = "internal I2C SCL"
[[pins]]
gpio = 12
policy = "fixed"
role = "internal I2C SDA"
[[pins]]
gpio = 13
policy = "fixed"
role = "I2S data out to AW88298"
[[pins]]
gpio = 14
policy = "fixed"
role = "I2S data in from ES7210"
[[pins]]
gpio = 17
policy = "fixed"
role = "Grove Port C UART TX"
[[pins]]
gpio = 18
policy = "fixed"
role = "Grove Port C UART RX"
[[pins]]
gpio = 19
policy = "fixed"
role = "USB D-/CDC"
[[pins]]
gpio = 20
policy = "fixed"
role = "USB D+/CDC"
[[pins]]
gpio = 33
policy = "fixed"
role = "I2S word select"
[[pins]]
gpio = 34
policy = "fixed"
role = "I2S bit clock"
[[pins]]
gpio = 35
policy = "fixed"
role = "LCD DC / SD MISO"
[[pins]]
gpio = 36
policy = "fixed"
role = "SPI SCK"
[[pins]]
gpio = 37
policy = "fixed"
role = "SPI MOSI"
[[pins]]
gpio = 43
policy = "fixed"
role = "UART TX"
[[pins]]
gpio = 44
policy = "fixed"
role = "UART RX"
